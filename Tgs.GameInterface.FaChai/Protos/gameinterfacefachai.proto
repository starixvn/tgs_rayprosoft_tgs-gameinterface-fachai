syntax = "proto3";

import "phoenix/protobuf/decimal.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "Tgs.GameInterface.FaChai.Protos";

package gameinterfacefachai;

// The greeting service definition.
service GameInterfaceFaChai {
  // Sends a greeting
  rpc PlayerCreate (PlayerCreateRequest) returns (BaseReply);
  rpc PlayerBalance (PlayerBalanceRequest) returns (PlayerBalanceReply);
  rpc PlayerLogout (PlayerLogoutRequest) returns (BaseReply);
  rpc FundIn (FundRequest) returns (FundReply);
  rpc FundOut (FundRequest) returns (FundReply);
  rpc FundStatus(FundStatusRequest) returns (BaseReply);
  rpc GameUrl (GameUrlRequest) returns (GameUrlReply);
  rpc GameRecord (GameRecordRequest) returns (GameRecordReply);
  rpc GameRecordHistory (GameRecordRequest) returns (GameRecordReply);
}

// The request message containing the user's name.
message PlayerCreateRequest {
	string api_url = 1;
	string agent_code = 2;
	string agent_key = 3;
	string currency = 4;
	string player_code = 5;
}

message PlayerBalanceRequest {
	string api_url = 1;
	string agent_code = 2;
	string agent_key = 3;
	string currency = 4;
	string player_code = 5;
}

message PlayerLogoutRequest {
	string api_url = 1;
	string agent_code = 2;
	string agent_key = 3;
	string currency = 4;
	string player_code = 5;
}

message FundRequest {
	string api_url = 1;
	string agent_code = 2;
	string agent_key = 3;
	string currency = 4;
	string player_code = 5;
	phoenix.protobuf.DecimalValue amount = 6;
}

message FundStatusRequest {
	string api_url = 1;
	string agent_code = 2;
	string agent_key = 3;
	string currency = 4;
	string trs_id = 5;
}

message GameUrlRequest {
	string api_url = 1;
	string agent_code = 2;
	string agent_key = 3;
	string currency = 4;
	string player_code = 5;
	int32 game_id = 6;
	int32 language_id = 7;
}

message GameRecordRequest {
	string api_url = 1;
	string agent_code = 2;
	string agent_key = 3;
	string currency = 4;
	google.protobuf.Timestamp start_date = 5;
	google.protobuf.Timestamp end_date = 6;
}

// The response message containing the greetings.
message BaseReply {
	bool state = 1;
}

message PlayerBalanceReply {
	bool is_player_exist = 1;
	phoenix.protobuf.DecimalValue balance = 2;
}

message FundReply {
	string trs_id = 1;
	int64 bank_id = 2;
	phoenix.protobuf.DecimalValue balance = 3;
	phoenix.protobuf.DecimalValue amount = 4;
	string res = 5;
}

message GameUrlReply{
	string game_url = 1;
}

message GameRecordReply {
	repeated GameRecord items = 1;
}

message GameRecord {
	string external_round_id = 1;
	string ExternalGameId = 2;
    string player_code = 3;
	google.protobuf.Timestamp external_created_on = 4;
	google.protobuf.Timestamp external_closed_on = 5;
	phoenix.protobuf.DecimalValue bet = 6;
	phoenix.protobuf.DecimalValue settle = 7;
	phoenix.protobuf.DecimalValue win_loss = 8;
	phoenix.protobuf.DecimalValue jppoints = 9;
	string additional_data = 10;
}